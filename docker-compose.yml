services:
  postgres:
    image: postgres:17-alpine
    container_name: stars_bot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stars_bot}
      POSTGRES_USER: ${POSTGRES_USER:-stars_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
